apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: letsencrypt-production}
spec: {acme: {email: REPLACE_EMAIL, server: https://acme-v02.api.letsencrypt.org/directory, privateKeySecretRef: {name: letsencrypt-production}, solvers: [{http01: {ingress: {class: traefik}}}]}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: retail, namespace: retail-intelligence, annotations: {cert-manager.io/cluster-issuer: letsencrypt-production}}
spec:
  ingressClassName: traefik
  tls: [{hosts: [REPLACE.duckdns.org], secretName: retail-tls}]
  rules:
  - host: REPLACE.duckdns.org
    http: {paths: [{path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 8000}}}},{path: /admin, pathType: Prefix, backend: {service: {name: admin-web, port: {number: 80}}}},{path: /grafana, pathType: Prefix, backend: {service: {name: grafana, port: {number: 3000}}}},{path: /, pathType: Prefix, backend: {service: {name: owner-web, port: {number: 3000}}}}]}
