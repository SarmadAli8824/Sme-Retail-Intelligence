apiVersion: batch/v1
kind: CronJob
metadata: {name: weekly-digest, namespace: retail-intelligence}
spec:
  schedule: "0 8 * * 1"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {app: worker-job}}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: ghcr.io/REPLACE/sme-retail-worker:latest
              env:
                - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: retail-secrets, key: worker-database-url}}}
                - {name: RESEND_API_KEY, valueFrom: {secretKeyRef: {name: retail-secrets, key: resend-api-key, optional: true}}}
                - {name: RESEND_FROM, valueFrom: {configMapKeyRef: {name: retail-config, key: RESEND_FROM}}}
                - {name: WORKER_RUN_ONCE, value: "true"}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: encrypted-postgres-backup, namespace: retail-intelligence}
spec:
  schedule: "30 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {app: backup}}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: ghcr.io/REPLACE/retail-pg-backup:latest
              env:
                - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: retail-secrets, key: backup-database-url}}}
                - name: GPG_PASSPHRASE
                  valueFrom:
                    secretKeyRef: {name: backup-secrets, key: gpg-passphrase}
                - {name: OCI_UPLOAD_URL, valueFrom: {secretKeyRef: {name: backup-secrets, key: oci-upload-url}}}
