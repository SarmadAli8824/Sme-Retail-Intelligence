apiVersion: v1
kind: ConfigMap
metadata: {name: retail-config, namespace: retail-intelligence}
data:
  FRONTEND_ORIGIN: https://REPLACE.duckdns.org
  RESEND_FROM: onboarding@resend.dev
  MAX_UPLOAD_BYTES: "5000000"
  QUERY_TIMEOUT_MS: "2000"
  SEED_DEMO_DATA: "false"
---
# This file is a template. Replace every placeholder before applying it.
apiVersion: v1
kind: Secret
metadata: {name: retail-secrets, namespace: retail-intelligence}
type: Opaque
stringData:
  api-database-url: postgresql+psycopg://retail:REPLACE@postgres:5432/retail_intelligence
  worker-database-url: postgres://retail:REPLACE@postgres:5432/retail_intelligence?sslmode=disable
  backup-database-url: postgres://retail:REPLACE@postgres:5432/retail_intelligence?sslmode=disable
  jwt-secret: REPLACE_WITH_LONG_RANDOM_VALUE
  gemini-api-key: ""
  groq-api-key: ""
  resend-api-key: ""
---
apiVersion: v1
kind: Secret
metadata: {name: postgres-secrets, namespace: retail-intelligence}
type: Opaque
stringData: {password: REPLACE}
---
apiVersion: v1
kind: Secret
metadata: {name: backup-secrets, namespace: retail-intelligence}
type: Opaque
stringData:
  gpg-passphrase: REPLACE_WITH_LONG_RANDOM_VALUE
  oci-upload-url: https://objectstorage.REPLACE
---
apiVersion: v1
kind: Secret
metadata: {name: grafana-secrets, namespace: retail-intelligence}
type: Opaque
stringData: {admin-password: REPLACE_WITH_LONG_RANDOM_VALUE}
