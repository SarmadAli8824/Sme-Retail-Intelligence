apiVersion: v1
kind: ConfigMap
metadata: {name: retail-config, namespace: retail-intelligence}
data: {FRONTEND_ORIGIN: https://REPLACE.duckdns.org, RESEND_FROM: onboarding@resend.dev}
---
apiVersion: v1
kind: Secret
metadata: {name: retail-secrets, namespace: retail-intelligence}
type: Opaque
stringData: {DATABASE_URL: postgresql+psycopg://retail:REPLACE@postgres:5432/retail_intelligence, JWT_SECRET: REPLACE_WITH_LONG_RANDOM_VALUE, GEMINI_API_KEY: "", GROQ_API_KEY: "", RESEND_API_KEY: ""}

