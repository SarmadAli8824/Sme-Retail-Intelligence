apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: retail-intelligence}
spec: {clusterIP: None, selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: retail-intelligence}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env: [{name: POSTGRES_DB, value: retail_intelligence},{name: POSTGRES_USER, value: retail},{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-secrets, key: password}}}]
        ports: [{containerPort: 5432}]
        resources: {requests: {cpu: 150m, memory: 384Mi}, limits: {cpu: "1", memory: 1Gi}}
        readinessProbe: {exec: {command: ["sh","-c","pg_isready -U retail"]}, initialDelaySeconds: 10}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates: [{metadata: {name: data}, spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 20Gi}}}}]

