apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-only-api-worker, namespace: retail-intelligence}
spec: {podSelector: {matchLabels: {app: postgres}}, policyTypes: [Ingress], ingress: [{from: [{podSelector: {matchLabels: {app: api}}},{podSelector: {matchLabels: {app: worker}}},{podSelector: {matchLabels: {app: worker-job}}},{podSelector: {matchLabels: {app: backup}}},{podSelector: {matchLabels: {app: postgres-exporter}}}], ports: [{protocol: TCP, port: 5432}]}]}
