apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: retail-intelligence}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers: [{name: api, image: ghcr.io/REPLACE/sme-retail-api:latest, envFrom: [{secretRef: {name: retail-secrets}},{configMapRef: {name: retail-config}}], ports: [{containerPort: 8000}], resources: {requests: {cpu: 150m, memory: 384Mi}, limits: {cpu: "1", memory: 1Gi}}, readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}, livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: retail-intelligence}
spec: {selector: {app: api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: retail-intelligence}
spec: {scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}, minReplicas: 2, maxReplicas: 4, metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: owner-web, namespace: retail-intelligence}
spec: {replicas: 2, selector: {matchLabels: {app: owner-web}}, template: {metadata: {labels: {app: owner-web}}, spec: {containers: [{name: owner-web,image: ghcr.io/REPLACE/sme-retail-owner:latest,ports: [{containerPort: 3000}],resources: {requests: {cpu: 50m,memory: 128Mi},limits: {cpu: 300m,memory: 256Mi}}}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: owner-web, namespace: retail-intelligence}
spec: {selector: {app: owner-web}, ports: [{port: 3000, targetPort: 3000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin-web, namespace: retail-intelligence}
spec: {replicas: 1, selector: {matchLabels: {app: admin-web}}, template: {metadata: {labels: {app: admin-web}}, spec: {containers: [{name: admin-web,image: ghcr.io/REPLACE/sme-retail-admin:latest,ports: [{containerPort: 80}],resources: {requests: {cpu: 50m,memory: 128Mi},limits: {cpu: 300m,memory: 256Mi}}}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: admin-web, namespace: retail-intelligence}
spec: {selector: {app: admin-web}, ports: [{port: 80, targetPort: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: retail-intelligence}
spec: {replicas: 1, selector: {matchLabels: {app: worker}}, template: {metadata: {labels: {app: worker}}, spec: {containers: [{name: worker,image: ghcr.io/REPLACE/sme-retail-worker:latest,envFrom: [{secretRef: {name: retail-secrets}}],resources: {requests: {cpu: 50m,memory: 96Mi},limits: {cpu: 300m,memory: 256Mi}}}]}}}
