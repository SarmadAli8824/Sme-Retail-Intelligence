name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    env:
      PYTHONPATH: .
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with: {python-version: '3.12'}
    - run: pip install -r requirements.txt pytest
    - run: pytest tests
  worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/worker}}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.23'
        cache-dependency-path: services/worker/go.sum
    - run: go test ./...
  containers-and-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - run: docker compose build
    - uses: actions/setup-python@v6
      with: {python-version: '3.12'}
    - run: pip install PyYAML
    - run: python -c "import pathlib, yaml; [list(yaml.safe_load_all(path.read_text(encoding='utf-8'))) for path in pathlib.Path('infra/kubernetes').glob('*.yaml')]; print('All Kubernetes YAML files are valid')"
