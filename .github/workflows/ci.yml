name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: pip install -r requirements.txt pytest
    - run: pytest tests
  worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/worker}}
    steps: [{uses: actions/checkout@v4},{uses: actions/setup-go@v5,with: {go-version: '1.23'}},{run: go test ./...}]
  containers-and-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - run: docker compose build
    - uses: azure/setup-kubectl@v4
    - run: kubectl apply --dry-run=client -f infra/kubernetes

