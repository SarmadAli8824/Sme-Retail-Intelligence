name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest tests -q

  worker:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/worker}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: "1.25", cache-dependency-path: services/worker/go.sum}
      - run: go test ./...

  web-apps:
    runs-on: ubuntu-latest
    strategy: {matrix: {app: [owner-web, admin-web]}}
    defaults: {run: {working-directory: "apps/${{ matrix.app }}"}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: {node-version: "22", cache: npm, cache-dependency-path: "apps/${{ matrix.app }}/package-lock.json"}
      - run: npm ci
      - run: npm run build

  containers-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose --profile operations build backup
      - run: docker compose up -d --wait --wait-timeout 180
      - run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/health
          curl --fail --silent --show-error http://localhost:3000 > /dev/null
          curl --fail --silent --show-error --location http://localhost:4200 > /dev/null
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install PyYAML
      - run: python -c "import pathlib,yaml; [list(yaml.safe_load_all(p.read_text())) for p in pathlib.Path('infra/kubernetes').glob('*.yaml')]; print('Kubernetes YAML syntax is valid')"
      - run: docker run --rm -v "${PWD}/infra/kubernetes:/manifests" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas /manifests
      - if: always()
        run: docker compose down --volumes
